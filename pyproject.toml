[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipscout"
version = "0.1.0"
description = "Open-source AI agent that finds the key moments in long videos and clips them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "faster-whisper"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
clipscout = "clipscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
